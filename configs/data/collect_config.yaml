# each API takes different keywords for start and end datetimes,
# but all will have the same value (for our needs)

datetime_range:
  start: "2018-01-01T00:00:00Z"
  end: "2025-02-01T00:00:00Z"

data_source:
  weather:
    url: https://api.brightsky.dev/weather
    start_key: date
    end_key: last_date
    station_coords:
      berlin: [52.5200, 13.4050]  # Berlin
      hanmburg: [53.5488, 9.9872] # Hamburg
      munich: [48.1351, 11.5820]  # Munich
      cologne: [50.9375, 6.9603]  # Cologne

  price:
    url: https://api.energy-charts.info/price
    start_key: start
    end_key: end

  production:
    url: https://api.energy-charts.info/public_power
    start_key: start
    end_key: end

  trade:
    url: https://api.energy-charts.info/cbet
    start_key: start
    end_key: end